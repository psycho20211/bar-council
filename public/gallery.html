  <title>Gallery | National Professional Association</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="site-header"></div>

  <section class="page-header-section">
    <div class="container">
      <nav><ol class="breadcrumb breadcrumb-custom">
        <li class="breadcrumb-item"><a href="index.html">Home</a></li>
        <li class="breadcrumb-item">Media & News</li>
        <li class="breadcrumb-item active">Gallery</li>
      </ol></nav>
      <h1 class="page-title">Photo & Video Gallery</h1>
      <p style="color:rgba(255,255,255,.8);max-width:700px;">Browse through moments from our events, conferences, community activities, and association milestones.</p>
    </div>
  </section>

  <section class="section-padding">
    <div class="container">
      <!-- Filter -->
      <div class="text-center mb-4 fade-up">
        <div class="d-flex justify-content-center gap-2 flex-wrap">
          <button class="filter-pill gallery-filter-pill active" data-category="all">All</button>
          <button class="filter-pill gallery-filter-pill" data-category="conference">Conferences</button>
          <button class="filter-pill gallery-filter-pill" data-category="workshop">Workshops</button>
          <button class="filter-pill gallery-filter-pill" data-category="community">Community</button>
          <button class="filter-pill gallery-filter-pill" data-category="gala">Galas</button>
        </div>
      </div>

      <!-- Gallery Grid -->
      <div class="row g-3 fade-up">
        <div class="col-md-4 col-6 gallery-grid-item" data-category="conference">
          <div class="gallery-item" style="aspect-ratio:4/3;" data-bs-toggle="modal" data-bs-target="#galleryModal">
            <img src="https://images.pexels.com/photos/9275222/pexels-photo-9275222.jpeg?auto=compress&cs=tinysrgb&w=600&h=450" alt="Gallery">
            <div class="gallery-overlay"><i class="bi bi-zoom-in"></i></div>
          </div>
        </div>
        <div class="col-md-4 col-6 gallery-grid-item" data-category="conference">

            <div class="gallery-overlay"><i class="bi bi-zoom-in"></i></div>
          </div>
        </div>
        <div class="col-md-4 col-6 gallery-grid-item" data-category="workshop">
          <div class="gallery-item" style="aspect-ratio:4/3;" data-bs-toggle="modal" data-bs-target="#galleryModal">
            <img src="https://images.pexels.com/photos/1181738/pexels-photo-1181738.jpeg?auto=compress&cs=tinysrgb&w=600&h=450" alt="Gallery">
            <div class="gallery-overlay"><i class="bi bi-zoom-in"></i></div>
          </div>
        </div>
        <div class="col-md-4 col-6 gallery-grid-item" data-category="community">
          <div class="gallery-item" style="aspect-ratio:4/3;" data-bs-toggle="modal" data-bs-target="#galleryModal">
            <img src="https://images.pexels.com/photos/5686082/pexels-photo-5686082.jpeg?auto=compress&cs=tinysrgb&w=600&h=450" alt="Gallery">
            <div class="gallery-overlay"><i class="bi bi-zoom-in"></i></div>
          </div>
        </div>
        <div class="col-md-4 col-6 gallery-grid-item" data-category="conference">
          <div class="gallery-item" style="aspect-ratio:4/3;" data-bs-toggle="modal" data-bs-target="#galleryModal">
            <img src="https://images.pexels.com/photos/8761536/pexels-photo-8761536.jpeg?auto=compress&cs=tinysrgb&w=600&h=450" alt="Gallery">
            <div class="gallery-overlay"><i class="bi bi-zoom-in"></i></div>

            <div class="gallery-overlay"><i class="bi bi-zoom-in"></i></div>
          </div>
        </div>
        <div class="col-md-4 col-6 gallery-grid-item" data-category="gala">
          <div class="gallery-item" style="aspect-ratio:4/3;" data-bs-toggle="modal" data-bs-target="#galleryModal">

        <button class="btn btn-navy">Load More Photos <i class="bi bi-arrow-down ms-1"></i></button>
      </div>
    </div>
  </section>

  <!-- Gallery Modal -->
  <div class="modal fade" id="galleryModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered modal-xl">
      <div class="modal-content" style="background:transparent;border:none;">
        <button type="button" class="btn-close btn-close-white position-absolute end-0 m-3" style="z-index:10;" data-bs-dismiss="modal"></button>
        <img src="https://images.pexels.com/photos/9275222/pexels-photo-9275222.jpeg?auto=compress&cs=tinysrgb&w=1200&h=800" class="img-fluid rounded" alt="Gallery full view">
